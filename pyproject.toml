[build-system]
requires = ["setuptools >= 75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermitage"
# Single source of truth for the version is hermitage/__init__.py
dynamic = ["version"]
description = "A visually immersive, local-first media sanctuary for Calibre libraries."
# Hermitage's own code is 3.13-clean (the GNOME 50 Flatpak runtime ships
# 3.13, so every except-group stays parenthesized), but the sole data
# layer is cquarry, and every cquarry release since 1.9.0 declares
# requires-python >=3.14 and uses PEP 758 bare except-groups (a
# SyntaxError on 3.13). On a 3.13 interpreter the documented `pip install`
# therefore resolves to nothing: pip 26 rejects cquarry on
# Requires-Python before its syntax is even reached. The honest floor for
# any install of this project is 3.14.
requires-python = ">= 3.14"
license = "GPL-3.0-or-later"
authors = [
    { name = "Brandon LaRocque" },
]
dependencies = [
    "PyGObject >= 3.54",
    "Pillow >= 11.0",
    "PyYAML >= 6.0",
    "cquarry @ git+https://github.com/VirInvictus/cquarry.git",
]

[project.scripts]
hermitage = "hermitage.__main__:main"
hermitage-verify = "hermitage.verify:main"

[tool.setuptools.dynamic]
version = { attr = "hermitage.__version__" }

[tool.setuptools.packages.find]
include = ["hermitage*"]
# Declared in pyproject, packages.find defaults to namespace = true, which makes
# setuptools treat every directory as a candidate package and walk the whole tree
# with followlinks=True. That escapes the repo via build-flatpak/var/run -> /run
# (and /run/host -> /) and never terminates. hermitage/ is a regular package, so
# the classic finder finds it and prunes everything without an __init__.py.
namespaces = false

[tool.setuptools.package-data]
hermitage = ["*.css", "fonts/*.ttf", "fonts/*.txt", "fonts/README.md"]

[tool.ruff.lint.per-file-ignores]
# The gi.require_version() dance forces imports after module-level code in
# every GTK-facing module; silence E402 there so real violations stay visible.
"hermitage/*" = ["E402"]
