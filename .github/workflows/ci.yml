name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ruff + tests
    runs-on: ubuntu-latest
    # Hermitage needs PyGObject >= 3.54, which builds against girepository-2.0.
    # Ubuntu runners package girepository-1.0 only; Fedora carries girepository-2.0
    # (in glib2-devel) and matches the project's real GTK 4.22 target. Same
    # container approach as the workspace's Rust GTK apps (Atrium, Colophon).
    container: fedora:latest
    steps:
      - name: Install system + build dependencies
        run: |
          dnf install -y \
            gcc \
            python3 \
            python3-devel \
            glib2-devel \
            gobject-introspection-devel \
            gtk4-devel \
            libadwaita-devel \
            cairo-devel \
            cairo-gobject-devel \
            pkgconf-pkg-config

      - uses: actions/checkout@v4

      - name: Create venv and install ruff + project
        # A venv sidesteps Fedora's PEP 668 external-management guard. PyGObject
        # builds against the system girepository-2.0 installed above; the tests
        # are DB-only and need no display.
        run: |
          python3 -m venv /venv
          /venv/bin/pip install --upgrade pip
          /venv/bin/pip install ruff==0.15.20 .

      - name: ruff check
        run: /venv/bin/ruff check hermitage/

      - name: ruff format --check
        run: /venv/bin/ruff format --check hermitage/ tests/

      - name: unittest
        run: /venv/bin/python -m unittest discover -s tests
